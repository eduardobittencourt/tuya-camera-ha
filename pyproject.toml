[project]
name = "tuya-camera-ha"
version = "0.3.0b1"
description = "Tuya mobile WebRTC camera integration and bridge for Home Assistant"
requires-python = ">=3.14"

[project.optional-dependencies]
test = ["homeassistant==2026.9.4", "pytest-homeassistant-custom-component==0.13.367", "ha-ffmpeg", "av==17.0.1", "PyTurboJPEG==1.8.3", "tuya-mobile==1.2.0", "ruff"]

[tool.pytest.ini_options]
markers = ["media: real FFmpeg/RTSP end-to-end tests with a synthetic camera"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "custom_components/tuya_camera_bridge/vendor", "tuya-camera-bridge-addon/app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PERF", "PLW", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"custom_components/tuya_camera_bridge/vendor/**" = ["ALL"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.tuya_camera_bridge" = ["*.json", "translations/*.json", "vendor/tuya_mobile/LICENSE"]
