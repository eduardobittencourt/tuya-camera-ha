[project]
name = "tuya-camera-ha"
version = "0.4.0b1"
description = "Python Tuya camera integration for Home Assistant"
requires-python = ">=3.14"

[project.optional-dependencies]
test = ["homeassistant==2026.10.2", "pytest-homeassistant-custom-component==0.13.373", "ha-ffmpeg", "av==19.0.2", "PyTurboJPEG==2.5.0", "tuya-mobile==1.2.0", "tinytuya==1.20.0", "aiortc@https://github.com/aiortc/aiortc/archive/10ccd168528d93996d013d0ecfae679c3a764b68.zip", "paho-mqtt>=2.1.0", "ruff"]

[tool.pytest.ini_options]
markers = ["media: real FFmpeg/RTSP end-to-end tests with a synthetic camera"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "custom_components/tuya_camera_bridge/vendor"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PERF", "PLW", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"custom_components/tuya_camera_bridge/vendor/**" = ["ALL"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.tuya_camera_bridge" = ["*.json", "translations/*.json", "vendor/TUYA_MOBILE_LICENSE", "brand/*.png", "BRAND_ASSETS.md"]
