[project]
name = "tuya-camera-ha"
version = "0.1.0"
description = "Tuya mobile WebRTC camera integration and bridge for Home Assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PERF", "PLW", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"custom_components/tuya_camera_bridge/vendor/**" = ["ALL"]
