name: Feature request / Sugerir recurso
description: Describe a use case and the behavior you need.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Explain the use case in English or Portuguese. Do not include private account or camera data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Include relevant public model/firmware information and alternatives you considered.
    validations:
      required: true
