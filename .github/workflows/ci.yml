name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install '.[test]'
      - run: ruff check custom_components tests scripts
      - run: python scripts/check_repository.py
      - name: Test release gate with JavaScript coverage
        run: >-
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=coverage-js.lcov
          tests/test_release_gate.cjs
      - run: coverage run -m pytest -m 'not media'
        env:
          COVERAGE_FILE: .coverage.python

      - name: Upload Python coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python
          path: |
            .coverage.python
            coverage-js.lcov
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/package_release.py
      - run: python3 scripts/check_repository.py --archive dist/tuya_camera.zip
      - uses: actions/upload-artifact@v4
        with:
          name: python-integration
          path: dist/*
          retention-days: 7

  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-media.txt
      - name: Install test dependencies and checksum-pinned FFmpeg
        timeout-minutes: 4
        run: |
          pip install --timeout 15 --retries 2 '.[test]'
          pip install --timeout 15 --retries 2 --require-hashes --no-deps --only-binary=:all: -r requirements-media.txt
          python -c 'import imageio_ffmpeg; print("TEST_FFMPEG_BINARY=" + imageio_ffmpeg.get_ffmpeg_exe())' >> "$GITHUB_ENV"
      - name: Download media test tools
        timeout-minutes: 3
        run: |
          "$TEST_FFMPEG_BINARY" -version
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 2 --retry-max-time 120 \
            https://github.com/bluenviron/mediamtx/releases/download/v1.21.1/mediamtx_v1.21.1_linux_amd64.tar.gz \
            --output /tmp/mediamtx.tar.gz
          tar -xzf /tmp/mediamtx.tar.gz -C /tmp mediamtx
          curl --fail --location --connect-timeout 10 --max-time 60 --retry 2 --retry-max-time 120 \
            https://github.com/AlexxIT/go2rtc/releases/download/v1.9.14/go2rtc_linux_amd64 \
            --output /tmp/go2rtc
          echo "32d616af226bd731678ffde328b94cfb94e30339bfefc469cfb76323144615a6  /tmp/go2rtc" | sha256sum --check
          chmod 0755 /tmp/go2rtc
      - run: coverage run -m pytest -m media --timeout=120
        env:
          COVERAGE_FILE: .coverage.media
          TEST_MEDIAMTX_BINARY: /tmp/mediamtx
          TEST_GO2RTC_BINARY: /tmp/go2rtc
          TEST_WEBRTC_PROBE: scripts/webrtc_probe.py

      - name: Upload media coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-media
          path: .coverage.media
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: SonarQube scan
    needs: [python, media]
    # Fork PRs run tests without receiving the analysis credential.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Download coverage data from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage and export XML
        run: |
          python -m pip install --only-binary=:all: 'coverage==7.16.2'
          python -m coverage combine coverage-data
          python -m coverage xml -o coverage.xml
      - name: Read integration version
        run: |
          python -c 'import json, os, re; from pathlib import Path; version = json.loads(Path("custom_components/tuya_camera/manifest.json").read_text())["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+_-]*", version), "Invalid integration version"; print("SONAR_PROJECT_VERSION=" + version, file=open(os.environ["GITHUB_ENV"], "a"))'
      - name: Require analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectVersion=${{ env.SONAR_PROJECT_VERSION }}
            -Dsonar.qualitygate.wait=true
