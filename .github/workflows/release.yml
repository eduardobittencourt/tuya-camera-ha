name: Release integration

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require successful checks on this exact release commit
        uses: actions/github-script@v9
        with:
          script: |
            const {releaseGate} = require('./scripts/release_gate.cjs');
            await releaseGate({github, context});
      - run: python3 scripts/package_release.py
      - run: python3 scripts/check_repository.py --archive dist/tuya_camera.zip
      - name: Prepare a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/tuya_camera/manifest.json"))["version"])')
          tag="v${version}"
          prerelease=true
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          fi
          if gh release view "${tag}" --json isDraft > /tmp/tuya-release.json; then
            python3 -c 'import json; assert json.load(open("/tmp/tuya-release.json"))["isDraft"], "Refusing to overwrite a published release"'
            gh release edit "${tag}" --draft --prerelease="${prerelease}" --target "${GITHUB_SHA}" \
              --title "Tuya Camera ${version}" --notes-file CHANGELOG.md
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --draft --prerelease="${prerelease}" --target "${GITHUB_SHA}" \
              --title "Tuya Camera ${version}" --notes-file CHANGELOG.md
          fi
